<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f666b">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script defer src="{{ '/assets/js/main.js' | relative_url }}"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-header>
    <div class="shell nav-shell">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="COPES home">COPES</a>

      <button class="nav-toggle" data-nav-toggle aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-navigation">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>

      <nav class="nav" id="site-navigation" data-nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/team/' | relative_url }}" {% if page.url contains '/team' %}aria-current="page"{% endif %}>Team</a>
        <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}aria-current="page"{% endif %}>Blog</a>
        <a href="{{ '/contact/' | relative_url }}" {% if page.url contains '/contact' %}aria-current="page"{% endif %}>Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="shell footer-grid">
      <div class="footer-about">
        <a class="brand footer-brand" href="{{ '/' | relative_url }}">COPES</a>
        <p>Immersive clinical training integrating virtual reality, intelligent interaction, procedural practice, and structured feedback.</p>
      </div>

      <nav class="footer-links" aria-label="Footer navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/team/' | relative_url }}">Team</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>

      <p class="footer-copy">© <span data-year></span> COPES. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
